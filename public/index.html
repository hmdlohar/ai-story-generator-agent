<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; max-width: 1200px; margin: 0 auto; padding: 2rem; color: #1f2937; }
    header.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; gap: 1rem; flex-wrap: wrap; }
    header.top h1 { font-size: 1.5rem; }
    header.top .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    header.top a { padding: 0.6rem 1.2rem; border-radius: 8px; text-decoration: none; font-size: 0.95rem; }
    header.top a.primary { background: #2563eb; color: #fff; }
    header.top a.primary:hover { background: #1d4ed8; }
    header.top a.secondary { background: #059669; color: #fff; }
    header.top a.secondary:hover { background: #047857; }

    .toolbar { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; margin-bottom: 1.5rem; }
    .toolbar input[type="search"], .toolbar select {
      padding: 0.5rem 0.75rem; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem; background: #fff;
    }
    .toolbar input[type="search"] { flex: 1; min-width: 200px; }
    .toolbar label { font-size: 0.85rem; color: #555; display: flex; align-items: center; gap: 0.4rem; }
    .toolbar .spacer { flex: 1; }

    .count-bar { color: #555; font-size: 0.9rem; margin-bottom: 1rem; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }

    .card { border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; background: #fff; display: flex; flex-direction: column; transition: box-shadow .15s, transform .15s; text-decoration: none; color: inherit; }
    .card:hover { box-shadow: 0 6px 18px rgba(0,0,0,0.08); transform: translateY(-2px); }
    .thumb { width: 100%; aspect-ratio: 9/16; background: linear-gradient(135deg, #eef2ff, #faf5ff); display: flex; align-items: center; justify-content: center; color: #9ca3af; font-size: 0.85rem; overflow: hidden; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb { position: relative; }
    .sched-btn { position: absolute; top: 6px; right: 6px; background: rgba(37,99,235,0.92); color: #fff; border: none; border-radius: 6px; padding: 0.3rem 0.55rem; font-size: 0.78rem; cursor: pointer; display: flex; align-items: center; gap: 0.25rem; backdrop-filter: blur(2px); }
    .sched-btn:hover { background: #1d4ed8; }
    .sched-btn:disabled { background: #9ca3af; cursor: default; }
    .card-body { padding: 0.75rem; display: flex; flex-direction: column; gap: 0.4rem; flex: 1; }
    .card-id { font-size: 0.75rem; color: #6b7280; font-weight: 600; }
    .card-title { font-size: 0.95rem; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.4em; }
    .card-preview { font-size: 0.8rem; color: #6b7280; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-meta { font-size: 0.72rem; color: #9ca3af; margin-top: auto; }
    .badges { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.4rem; }
    .badge { font-size: 0.68rem; padding: 0.15rem 0.45rem; border-radius: 4px; background: #e0e7ff; color: #3730a3; font-weight: 600; }
    .badge.video { background: #dcfce7; color: #166534; }
    .badge.audio { background: #ffedd5; color: #9a3412; }
    .badge.images { background: #fce7f3; color: #9d174d; }
    .badge.subtitle { background: #e0f2fe; color: #075985; }

    .empty { text-align: center; padding: 4rem 1rem; color: #6b7280; }
    .empty a { color: #2563eb; }

    .pagination { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 2rem; flex-wrap: wrap; }
    .pagination button { padding: 0.4rem 0.9rem; border: 1px solid #ccc; background: #fff; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
    .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
    .pagination button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .pagination .info { font-size: 0.85rem; color: #555; padding: 0 0.5rem; }

    .loading { text-align: center; padding: 3rem; color: #6b7280; }
    .error { color: #dc2626; padding: 1rem; background: #fef2f2; border-radius: 8px; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal-overlay.show { display: flex; }
    .modal { background: #fff; border-radius: 12px; padding: 1.5rem; max-width: 440px; width: calc(100% - 2rem); box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
    .modal h3 { font-size: 1.1rem; margin-bottom: 0.75rem; }
    .modal .slot-info { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 0.85rem; margin: 0.75rem 0; }
    .modal .slot-info .when { font-size: 1.05rem; font-weight: 700; color: #1e40af; }
    .modal .slot-info .sub { font-size: 0.82rem; color: #4b5563; margin-top: 0.2rem; }
    .modal .proj-name { font-weight: 600; color: #111827; }
    .modal .modal-error { color: #dc2626; font-size: 0.85rem; margin-top: 0.5rem; }
    .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; }
    .modal-actions button { padding: 0.55rem 1.1rem; border-radius: 8px; border: none; font-size: 0.92rem; cursor: pointer; }
    .btn-cancel { background: #e5e7eb; color: #374151; }
    .btn-cancel:hover { background: #d1d5db; }
    .btn-confirm { background: #2563eb; color: #fff; }
    .btn-confirm:hover { background: #1d4ed8; }
    .btn-confirm:disabled { background: #9ca3af; cursor: not-allowed; }
    .modal.success .slot-info { background: #ecfdf5; border-color: #a7f3d0; }
    .modal.success .slot-info .when { color: #065f46; }
  </style>
</head>
<body>
  <header class="top">
    <h1>Story Generator</h1>
    <div class="actions">
      <a href="/schedule.html" class="secondary">📅 Schedule</a>
      <a href="/queue.html" class="secondary">▤ Story Queue</a>
      <a href="/oneshot.html" class="secondary">⚡ One-Shot Story</a>
      <a href="/story.html" class="primary">+ New Story</a>
    </div>
  </header>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Search stories or project IDs...">
    <label>Sort
      <select id="sort">
        <option value="updated">Last updated</option>
        <option value="created">Created</option>
        <option value="name">Name</option>
        <option value="progress">Progress</option>
      </select>
    </label>
    <label>Order
      <select id="order">
        <option value="desc">Descending</option>
        <option value="asc">Ascending</option>
      </select>
    </label>
    <label>Per page
      <select id="limit">
        <option value="12">12</option>
        <option value="24">24</option>
        <option value="48">48</option>
      </select>
    </label>
  </div>

  <div class="count-bar" id="countBar"></div>
  <div class="error" id="error" style="display:none;"></div>
  <div class="grid" id="grid"></div>
  <div class="pagination" id="pagination"></div>

  <div class="modal-overlay" id="schedModal">
    <div class="modal" id="schedModalBox">
      <h3 id="schedTitle">Schedule to YouTube</h3>
      <div id="schedBody"></div>
      <div class="modal-error" id="schedError" style="display:none;"></div>
      <div class="modal-actions" id="schedActions"></div>
    </div>
  </div>

  <script>
    const grid = document.getElementById('grid');
    const pagination = document.getElementById('pagination');
    const countBar = document.getElementById('countBar');
    const errorDiv = document.getElementById('error');
    const searchInput = document.getElementById('search');
    const sortSelect = document.getElementById('sort');
    const orderSelect = document.getElementById('order');
    const limitSelect = document.getElementById('limit');

    const state = { page: 1, q: '', sort: 'updated', order: 'desc', limit: 12 };
    let searchTimer = null;
    let projectsCache = [];
    let schedContext = null;

    function readStateFromUrl() {
      const p = new URLSearchParams(window.location.search);
      if (p.get('page')) state.page = Math.max(1, parseInt(p.get('page'), 10) || 1);
      if (p.get('q')) { state.q = p.get('q'); searchInput.value = state.q; }
      if (p.get('sort')) { state.sort = p.get('sort'); sortSelect.value = state.sort; }
      if (p.get('order')) { state.order = p.get('order'); orderSelect.value = state.order; }
      if (p.get('limit')) { state.limit = parseInt(p.get('limit'), 10) || 12; limitSelect.value = state.limit; }
    }

    function writeStateToUrl() {
      const url = new URL(window.location.href);
      url.searchParams.set('page', state.page);
      url.searchParams.set('sort', state.sort);
      url.searchParams.set('order', state.order);
      url.searchParams.set('limit', state.limit);
      if (state.q) url.searchParams.set('q', state.q);
      else url.searchParams.delete('q');
      window.history.replaceState({}, '', url);
    }

    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function formatDate(ms) {
      if (!ms) return '';
      const d = new Date(ms);
      return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function badgesFor(p) {
      const b = [];
      if (p.hasVideo) b.push(['video', 'Video']);
      if (p.hasImages) b.push(['images', `${p.imageCount} img`]);
      if (p.hasAudio) b.push(['audio', 'Audio']);
      if (p.hasSubtitle) b.push(['subtitle', 'SRT']);
      return b;
    }

    function renderProjects(projects) {
      projectsCache = projects;
      if (projects.length === 0) {
        grid.innerHTML = `<div class="empty">No stories found. <a href="/story.html">Create your first story →</a></div>`;
        return;
      }
      grid.innerHTML = projects.map(p => {
        const thumb = p.thumbnail
          ? `<img src="${p.thumbnail}" alt="" loading="lazy">`
          : `<span>No image</span>`;
        const schedBtn = p.hasVideo
          ? `<button class="sched-btn" onclick="openScheduleModal(event, '${escapeHtml(p.projectId)}')">📅 Schedule</button>`
          : '';
        const title = escapeHtml(p.title && p.title !== p.projectId ? p.title : p.projectId);
        const preview = p.preview ? `<div class="card-preview">${escapeHtml(p.preview)}</div>` : '';
        const badges = badgesFor(p)
          .map(([cls, label]) => `<span class="badge ${cls}">${label}</span>`).join('');
        return `
          <a class="card" href="/story.html?projectId=${encodeURIComponent(p.projectId)}">
            <div class="thumb">${thumb}${schedBtn}</div>
            <div class="card-body">
              <div class="card-id">${escapeHtml(p.projectId)}</div>
              <div class="card-title">${title}</div>
              ${preview}
              <div class="badges">${badges}</div>
              <div class="card-meta">Updated ${escapeHtml(formatDate(p.updatedAt))}</div>
            </div>
          </a>`;
      }).join('');
    }

    function renderPagination(total, totalPages) {
      pagination.innerHTML = '';
      if (totalPages <= 1) return;

      const mkBtn = (label, page, opts = {}) => {
        const btn = document.createElement('button');
        btn.textContent = label;
        if (opts.disabled) btn.disabled = true;
        if (opts.active) btn.classList.add('active');
        btn.addEventListener('click', () => { state.page = page; load(); window.scrollTo(0, 0); });
        return btn;
      };

      pagination.appendChild(mkBtn('‹ Prev', state.page - 1, { disabled: state.page <= 1 }));

      const range = [];
      const start = Math.max(1, state.page - 2);
      const end = Math.min(totalPages, state.page + 2);
      for (let i = start; i <= end; i++) range.push(i);

      if (start > 1) {
        pagination.appendChild(mkBtn('1', 1));
        if (start > 2) pagination.appendChild(Object.assign(document.createElement('span'), { textContent: '…', className: 'info' }));
      }
      range.forEach(i => pagination.appendChild(mkBtn(String(i), i, { active: i === state.page })));
      if (end < totalPages) {
        if (end < totalPages - 1) pagination.appendChild(Object.assign(document.createElement('span'), { textContent: '…', className: 'info' }));
        pagination.appendChild(mkBtn(String(totalPages), totalPages));
      }

      pagination.appendChild(mkBtn('Next ›', state.page + 1, { disabled: state.page >= totalPages }));
      const info = document.createElement('span');
      info.className = 'info';
      info.textContent = `Page ${state.page} of ${totalPages}`;
      pagination.appendChild(info);
    }

    async function load() {
      writeStateToUrl();
      grid.innerHTML = `<div class="loading">Loading stories…</div>`;
      pagination.innerHTML = '';
      errorDiv.style.display = 'none';
      const params = new URLSearchParams({
        page: state.page, sort: state.sort, order: state.order, limit: state.limit,
      });
      if (state.q) params.set('q', state.q);
      try {
        const res = await fetch(`/api/projects?${params.toString()}`);
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Failed to load');
        renderProjects(data.projects);
        renderPagination(data.total, data.totalPages);
        const from = data.total === 0 ? 0 : (data.page - 1) * data.limit + 1;
        const to = Math.min(data.total, data.page * data.limit);
        countBar.textContent = data.total === 0
          ? 'No stories yet'
          : `Showing ${from}–${to} of ${data.total} stories`;
      } catch (e) {
        grid.innerHTML = '';
        errorDiv.textContent = e.message;
        errorDiv.style.display = 'block';
      }
    }

    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        state.q = searchInput.value.trim();
        state.page = 1;
        load();
      }, 300);
    });
    sortSelect.addEventListener('change', () => { state.sort = sortSelect.value; state.page = 1; load(); });
    orderSelect.addEventListener('change', () => { state.order = orderSelect.value; state.page = 1; load(); });
    limitSelect.addEventListener('change', () => { state.limit = parseInt(limitSelect.value, 10); state.page = 1; load(); });

    const schedModal = document.getElementById('schedModal');
    const schedModalBox = document.getElementById('schedModalBox');
    const schedTitle = document.getElementById('schedTitle');
    const schedBody = document.getElementById('schedBody');
    const schedError = document.getElementById('schedError');
    const schedActions = document.getElementById('schedActions');

    function fmtSlot(at, label) {
      const d = new Date(at);
      const when = d.toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
      return when;
    }

    function closeSchedModal() {
      schedModal.classList.remove('show');
      schedContext = null;
    }

    async function openScheduleModal(event, projectId) {
      event.preventDefault();
      event.stopPropagation();
      const project = projectsCache.find(p => p.projectId === projectId);
      const projTitle = project ? (project.title || projectId) : projectId;

      schedContext = { projectId, title: projTitle };
      schedModalBox.classList.remove('success');
      schedTitle.textContent = 'Schedule to YouTube';
      schedBody.innerHTML = `<p>Checking next available slot…</p>`;
      schedError.style.display = 'none';
      schedActions.innerHTML = `<button class="btn-cancel" onclick="closeSchedModal()">Cancel</button>`;
      schedModal.classList.add('show');

      try {
        const res = await fetch('/api/schedule/next?count=1');
        const data = await res.json();
        if (!data.success || !data.slots.length) throw new Error(data.error || 'No available slots');
        const slot = data.slots[0];
        schedContext.slot = slot;
        const when = fmtSlot(slot.at, slot.label);
        schedBody.innerHTML = `
          <p>Schedule <span class="proj-name">${escapeHtml(projTitle)}</span> to YouTube?</p>
          <div class="slot-info">
            <div class="when">${escapeHtml(when)}</div>
            <div class="sub">Next available ${escapeHtml(slot.label)} slot · ${escapeHtml(slot.date)}</div>
          </div>
          <p style="font-size:0.82rem;color:#6b7280;">The video will be handed to the posting bot and marked as scheduled.</p>`;
        schedActions.innerHTML = `
          <button class="btn-cancel" onclick="closeSchedModal()">Cancel</button>
          <button class="btn-confirm" onclick="confirmSchedule()">Yes, schedule</button>`;
      } catch (e) {
        schedBody.innerHTML = '';
        schedError.textContent = e.message;
        schedError.style.display = 'block';
        schedActions.innerHTML = `<button class="btn-cancel" onclick="closeSchedModal()">Close</button>`;
      }
    }

    async function confirmSchedule() {
      if (!schedContext) return;
      const btn = schedActions.querySelector('.btn-confirm');
      if (btn) { btn.disabled = true; btn.textContent = 'Scheduling…'; }
      schedError.style.display = 'none';
      try {
        const res = await fetch('/api/schedule/youtube', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ projectId: schedContext.projectId, title: schedContext.title }),
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Schedule failed');
        const when = fmtSlot(data.scheduledFor, data.slot.label);
        schedModalBox.classList.add('success');
        schedTitle.textContent = 'Scheduled!';
        schedBody.innerHTML = `
          <p><span class="proj-name">${escapeHtml(schedContext.title)}</span> is queued for posting.</p>
          <div class="slot-info">
            <div class="when">${escapeHtml(when)}</div>
            <div class="sub">Slot ${escapeHtml(data.slot.slotId)} · status: ${escapeHtml(data.slot.status)}</div>
          </div>`;
        schedActions.innerHTML = `<button class="btn-confirm" onclick="closeSchedModal()">Done</button>`;
      } catch (e) {
        if (btn) { btn.disabled = false; btn.textContent = 'Yes, schedule'; }
        schedError.textContent = e.message;
        schedError.style.display = 'block';
      }
    }

    window.openScheduleModal = openScheduleModal;
    window.closeSchedModal = closeSchedModal;
    window.confirmSchedule = confirmSchedule;

    readStateFromUrl();
    load();
  </script>
</body>
</html>
