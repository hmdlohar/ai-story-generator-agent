<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stories v2</title>
  <link rel="stylesheet" href="/story2.css">
  <style>
    .item { display: flex; gap: 1rem; align-items: center; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 0.75rem 1rem; margin-bottom: 0.6rem; }
    .item .info { flex: 1; min-width: 0; }
    .item .title { font-weight: 700; }
    .item .idea { color: #374151; font-size: 0.88rem; margin-top: 0.15rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .meta { margin-top: 0.3rem; display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
    .tag { font-size: 0.75rem; padding: 0.1rem 0.5rem; border-radius: 999px; background: #f3f4f6; color: #374151; }
    .tag.ok { background: #dcfce7; color: #166534; }
    .tag.run { background: #dbeafe; color: #1e40af; }
    .tag.err { background: #fee2e2; color: #991b1b; }
    .item .actions { display: flex; gap: 0.4rem; flex-shrink: 0; }
    @media (max-width: 600px) { .item { flex-direction: column; align-items: stretch; } }
  </style>
</head>
<body>
  <nav class="top">
    <a href="/story2-list.html">All v2 stories</a>
    <a href="/story2.html">+ New story</a>
    <a href="/" class="right">v1</a>
  </nav>
  <main>
    <h1>Stories v2</h1>
    <div id="status">Loading...</div>
    <div id="list"></div>
  </main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let timer = null;

async function load() {
  clearTimeout(timer);
  try {
    const r = await (await fetch("/api/v2/projects")).json();
    if (!r.success) throw new Error(r.error);
    $("status").style.display = r.projects.length ? "none" : "";
    $("status").textContent = "No v2 stories yet.";
    $("list").innerHTML = r.projects.map((p) => {
      const id = encodeURIComponent(p.id);
      const job = p.job?.running ? `<span class="tag run">${esc(p.job.label)}</span>`
        : p.job?.error ? `<span class="tag err">Failed</span>` : "";
      return `<div class="item">
        <div class="info">
          <div class="title">${esc(p.title || p.id)}</div>
          <div class="idea">${esc(p.input || "(no idea yet)")}</div>
          <div class="meta">
            <span class="muted">${esc(p.id)} · ${new Date(p.updatedAt).toLocaleString()}</span>
            ${p.scenes ? `<span class="tag">${p.scenes} scenes</span>` : ""}
            ${p.audio ? `<span class="tag ok">audio</span>` : ""}
            ${p.video ? `<span class="tag ok">video</span>` : ""}
            ${job}
          </div>
        </div>
        <div class="actions">
          <a class="btn small" href="/story2.html?id=${id}">Open</a>
          <button class="small alt" onclick="clone('${id}')">Clone</button>
        </div>
      </div>`;
    }).join("");
    if (r.projects.some((p) => p.job?.running)) timer = setTimeout(load, 3000);
  } catch (e) {
    $("status").style.display = "";
    $("status").textContent = e.message;
    $("status").className = "err";
  }
}
// Clone happens on the server; then open the new project.
async function clone(id) {
  const r = await (await fetch(`/api/v2/project/${id}/clone`, { method: "POST" })).json();
  if (!r.success) return alert(r.error);
  location.href = `/story2.html?id=${encodeURIComponent(r.id)}`;
}
load();
</script>
</body>
</html>
